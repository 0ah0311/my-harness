# 허들링 하네스 — 기본값

pipeline:
  output_folder: output
  instructions_folder: instructions
  resume: true
  resume_pattern: "output/NN-*.md"

file:
  header: "<!-- agent: {name} | input: {path} | created: {timestamp} -->"
  auto_create_folders:
    - output
    - instructions

triggers:
  start: "허들링 레퍼런스 수집 시작해줘"
  restart: "{N}단계부터 다시 시작해줘"

uncertainty:
  action: stop_and_ask
  format: "한 줄 질문 + 기다리는 이유 1줄"

keyscreen:
  count: "2..3"
  size: "390x844"
