# 허들링 하네스 — 게이트 규칙

gates:
  - step: 1
    agent: collect
    output: output/01-references.md
    conditions:
      - file_exists
      - item_count >= 3
    judge: machine
    on_fail: delete_and_rerun

  - step: 2
    agent: analyze
    output: output/02-analysis.md
    conditions:
      - file_exists
      - section_exists: "## 반영 포인트"
    judge: machine
    on_fail: delete_and_rerun

  - step: 3
    agent: spec
    output: output/03-spec.md
    conditions:
      - file_exists
      - screen_count >= 1
    judge: machine
    on_fail: delete_and_rerun

  - step: 4
    agent: figma-keyscreen
    output: output/04-figma-result.md
    conditions:
      - file_exists
      - figma_url_count: "2..3"
    judge: machine
    on_fail: delete_and_rerun

  - step: 5
    agent: assistant_human
    output: instructions/05-stakeholder-review.md
    conditions:
      - human_approval: "승인"
    judge: human
    on_reject:
      trigger: "재작업"
      delete: output/03-spec.md
      rerun: 3

  - step: 7
    agent: validate
    output: output/07-validation.md
    conditions:
      - file_exists
      - violation_count == 0
    judge: machine
    on_fail: delete_and_rerun

flags:
  privacy_check:
    agent: spec
    trigger_strings:
      - "공개"
      - "전체 공개"
    insert_flag: "<!-- FLAG: 비공개 원칙 확인 필요 -->"
    confirm_string: "확인 완료"
    block_next_step: true

enforce:
  violation_auto_pass: false
  violation_action: stop_and_report
